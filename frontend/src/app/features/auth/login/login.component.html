<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
    <div class="card-body p-4">
      <h1 class="h4 mb-1 text-center">Task Manager</h1>
      <p class="text-muted text-center mb-4">Inicia sesión para gestionar tus tareas</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            [class.is-invalid]="username.invalid && username.touched"
            autocomplete="username"
          />
          @if (username.invalid && username.touched) {
            <div class="invalid-feedback">El usuario es obligatorio.</div>
          }
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="password.invalid && password.touched"
            autocomplete="current-password"
          />
          @if (password.invalid && password.touched) {
            <div class="invalid-feedback">La contraseña es obligatoria.</div>
          }
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Iniciar sesión
        </button>
      </form>
    </div>
  </div>
</div>
