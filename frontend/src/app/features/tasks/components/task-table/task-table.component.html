<div class="table-responsive">
  <table class="table table-hover align-middle bg-white">
    <thead>
      <tr>
        <th>Título</th>
        <th>Descripción</th>
        <th style="width: 180px;">Estado</th>
        <th style="width: 160px;">Actualizada</th>
        <th style="width: 120px;" class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @if (loading) {
        <tr>
          <td colspan="5" class="text-center py-4">
            <span class="spinner-border spinner-border-sm me-2"></span> Cargando tareas...
          </td>
        </tr>
      } @else if (tasks.length === 0) {
        <tr>
          <td colspan="5" class="text-center text-muted py-4">No hay tareas para mostrar.</td>
        </tr>
      } @else {
        @for (task of tasks; track task.id) {
          <tr>
            <td class="fw-semibold">{{ task.title }}</td>
            <td class="text-truncate" style="max-width: 280px;" [title]="task.description || ''">
              {{ task.description || '—' }}
            </td>
            <td>
              <select
                class="form-select form-select-sm"
                [class]="statusBadgeClass(task.status)"
                [value]="task.status"
                (change)="onStatusSelect(task, $any($event.target).value)"
              >
                @for (s of statuses; track s) {
                  <option [value]="s">{{ statusLabels[s] }}</option>
                }
              </select>
            </td>
            <td class="text-muted small">{{ task.updatedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
            <td class="text-end">
              <button
                type="button"
                class="btn btn-sm btn-outline-primary me-1"
                title="Editar"
                (click)="edit.emit(task)"
              >
                <i class="bi bi-pencil-fill"></i>
              </button>
              <button
                type="button"
                class="btn btn-sm btn-outline-danger"
                title="Eliminar"
                (click)="delete.emit(task)"
              >
                <i class="bi bi-trash-fill"></i>
              </button>
            </td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
