server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular es una SPA: cualquier ruta que no sea un archivo real
    # debe devolver index.html para que el router de Angular la maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js se genera en cada arranque del contenedor (ver docker-entrypoint.sh)
    # y no debe cachearse en el navegador.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
